spring.application.name=AIResumeAnalyzer

#Groq AI Interface Platform - For LLM Access (Llama 3.3)
groq.api.key=${GROQAPIKEY}

#JDBC and MySQL Connection
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Hibernate and JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Qdrant vector database to store embeddings
qdrant.host=${QDRANTHOST}
qdrant.grpc-port=6334
qdrant.rest-url=${QDRANTRESTURL}
qdrant.api-key=${QDRANTAPIKEY}
qdrant.use-tls=true

#Voyage AI for embeddings
voyage.api.key=${VOYAGEAPIKEY}
voyage.model=voyage-4-lite
voyage.dimension=1024

#Retrieval Settings for RAG
rag.maximum-results=10
rag.minimum-score=0.65

server.servlet.session.timeout=30m
