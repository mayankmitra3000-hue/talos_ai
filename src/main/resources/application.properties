spring.application.name=AIInternshipAllocater

# Load .env as a properties file for local development
spring.config.import=optional:file:./.env[.properties]

# Groq AI
groq.api.key=${GROQ_API_KEY}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aiinternshipallocater}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate and JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Qdrant
qdrant.host=${QDRANT_HOST:localhost}
qdrant.grpc-port=${QDRANT_GRPC_PORT:6334}
qdrant.rest-url=${QDRANT_REST_URL:http://localhost:6333}
qdrant.api-key=${QDRANT_API_KEY:}
qdrant.use-tls=${QDRANT_USE_TLS:false}

# Voyage AI
voyage.api.key=${VOYAGE_API_KEY}
voyage.model=${VOYAGE_MODEL:voyage-4-lite}
voyage.dimension=${VOYAGE_DIMENSION:1024}

# RAG retrieval
rag.maximum-results=${RAG_MAXIMUM_RESULTS:10}
rag.minimum-score=${RAG_MINIMUM_SCORE:0.65}

# Server
server.servlet.session.timeout=30m
server.port=${SERVER_PORT:8082}
server.address=${SERVER_ADDRESS:0.0.0.0}