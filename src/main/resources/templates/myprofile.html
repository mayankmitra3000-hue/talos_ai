<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<div th:replace="~{fragments/head :: head('My Profile')}"></div>

<body class="min-h-screen bg-cover bg-center bg-no-repeat animate-fadeIn"
      style="background-image:url('/images/upperbgt.jpg');">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Main Content -->

<div class="max-w-3xl mx-auto pt-32 pb-12 px-6">

    <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl border-t-4 border-purple-500 p-10">
        <h1 class="text-4xl font-bold text-purple-900 mb-6"><center>My Profile</h1>
        <form th:action="@{/airesumeanalyzer/myprofile}" method="post" th:object="${user}" class="space-y-8">

            <div th:if="${success}"
                 th:text="${success}"
                 class="rounded-xl bg-green-100 px-4 py-3 text-green-700">
            </div>

            <!-- Username -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Username
                </label>

                <input type="text"
                       th:field="*{username}"
                       readonly
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl
                          focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Full Name -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Full Name
                </label>

                <input type="text"
                       th:field="*{fullName}"
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl
                          focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Contact -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Contact
                </label>

                <input type="text"
                       th:field="*{contact}"
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl
                          focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Email id -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Email Id
                </label>

                <input type="text"
                       th:field="*{email}"
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl
                          focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Update Button -->
            <button type="submit"
                    class="w-full bg-violet-600 hover:bg-violet-700
                           text-white py-3 rounded-xl">
                Update Profile
            </button>

        </form>

    </div>
</div>

</body>
</html>
