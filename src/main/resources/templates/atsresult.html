<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head('ATS Score Result')}"></div>

<body class="relative min-h-screen bg-cover bg-center bg-no-repeat animate-fadeIn select-none"
      style="background-image: url('/images/upperbgt.jpg');">

<!-- Dark Overlay -->
<div class="absolute inset-0 bg-black/50"></div>

<!-- Page Content -->
<div class="relative z-10">

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Spacer -->
    <div class="h-24"></div>

    <div class="max-w-5xl mx-auto px-6 pb-12">

        <!-- Result Card -->
        <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl border-t-4 border-purple-500 p-10">

            <!-- Header -->
            <div class="text-center mb-8">

                <div class="w-20 h-20 mx-auto rounded-3xl
                            bg-gradient-to-r from-purple-500 to-pink-500
                            flex items-center justify-center
                            text-5xl text-white shadow-xl mb-6">
                    📊
                </div>

                <h1 class="text-4xl font-bold text-gray-900">
                    ATS Score Report
                </h1>

                <p class="text-gray-600 mt-3 text-lg">
                    Your resume has been evaluated for ATS compatibility,
                    keyword optimization, formatting, and readability.
                </p>

            </div>

            <!-- Error Message -->
            <div th:if="${error}"
                 class="bg-red-100 border border-red-300 text-red-700 rounded-2xl p-5 mb-8">

                <h2 class="font-bold text-lg mb-2">
                    Unable to Generate ATS Report
                </h2>

                <p th:text="${error}"></p>

            </div>

            <!-- ATS Report -->
            <div th:if="${analysis}">

                <div class="flex items-center gap-3 mb-5">

                    <div class="w-10 h-10 rounded-xl bg-purple-100 flex items-center justify-center text-xl">
                        🤖
                    </div>

                    <h2 class="text-2xl font-bold text-gray-800">
                        AI Generated ATS Analysis
                    </h2>

                </div>

                <div class="bg-gray-50 border border-gray-200 rounded-2xl shadow-inner p-8 max-h-[600px] overflow-y-auto">

                    <pre class="whitespace-pre-wrap text-gray-700 leading-8 text-base font-sans"
                         th:text="${analysis}">
                    </pre>

                </div>

            </div>

            <!-- Buttons -->
            <div class="mt-10 flex flex-col sm:flex-row justify-center gap-5">

                <a href="/airesumeanalyzer/ats-score-generator"
                   class="px-8 py-3 rounded-xl
                          bg-purple-600
                          hover:bg-purple-700
                          text-white
                          font-semibold
                          transition">

                    Generate Another Score

                </a>

                <a href="/airesumeanalyzer/home"
                   class="px-8 py-3 rounded-xl
                          bg-gray-700
                          hover:bg-gray-800
                          text-white
                          font-semibold
                          transition">

                    Back to Home

                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
