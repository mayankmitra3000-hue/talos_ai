<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>AI Resume Analyzer</title>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    keyframes: {
                        fadeIn: {
                            '0%': {opacity: '0'},
                            '100%': {opacity: '1'},
                        }
                    },
                    animation: {
                        fadeIn: 'fadeIn 2s ease-out forwards'
                    }
                }
            }
        }
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-cover bg-no-repeat bg-center select-none animate-fadeIn"
style="background-image: url('/images/upperbgt.jpg');">

<nav class="fixed top-0 left-0 w-full bg-white/95 backdrop-blur-md border-b border-gray-200 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

        <!-- Logo -->
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-cyan-600 rounded-xl flex items-center justify-center">
                <span class="text-white font-bold text-lg">AI</span>
            </div>
            <div>
                <h1 class="text-xl font-bold text-gray-800">
                    Resume Analyzer
                </h1>
                <p class="text-xs text-gray-500">
                    Smart Career Insights
                </p>
            </div>
        </div>

        <!-- Navigation Links -->
        <div class="hidden md:flex items-center gap-8">
            <a href="/" class="text-gray-600 hover:text-cyan-600 font-medium transition">
                Home
            </a>
            <a href="/upload" class="text-gray-600 hover:text-cyan-600 font-medium transition">
                My Resumes
            </a>
            <a href="/analyze" class="text-gray-600 hover:text-cyan-600 font-medium transition">
                About Us
            </a>
        </div>

        <!-- Right Side -->
        <div class="flex items-center gap-4">
            <button class="px-5 py-2 bg-cyan-600 hover:bg-cyan-700 text-white font-semibold rounded-xl shadow-lg transition-all duration-300 hover:scale-105">
                Logout
            </button>
        </div>

    </div>
</nav>

</body>
</html>
