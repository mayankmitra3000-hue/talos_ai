<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head('Find Best Resume')}"></div>

<body class="min-h-screen bg-cover bg-center bg-no-repeat animate-fadeIn"
      style="background-image:url('/images/upperbgt.jpg');">

<!-- Dark Overlay -->
<div class="absolute inset-0 bg-black/50"></div>

<div class="relative z-10">

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="h-24"></div>

    <div class="max-w-5xl mx-auto px-6 pb-12">

        <!-- Heading -->
        <div class="text-center mb-10">

            <h1 class="text-4xl font-bold text-white">
                Find Best Resume
            </h1>

            <p class="text-gray-200 mt-3">
                Enter the job description below. AI will search all uploaded resumes
                using RAG and identify the most suitable candidate.
            </p>

        </div>

        <!-- Form Card -->
        <div class="bg-white/95 rounded-3xl shadow-2xl border-t-4 border-violet-500 p-10">

            <form th:action="@{/resume-match/find}" method="post" class="space-y-8">

                <!-- Job Title -->
                <div>
                    <label class="block font-semibold mb-2 text-gray-700">
                        Job Title
                    </label>

                    <input
                            type="text"
                            name="jobTitle"
                            required
                            placeholder="e.g. Java Backend Developer"
                            class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:ring-2 focus:ring-cyan-500 outline-none">
                </div>

                <!-- Experience -->
                <div>
                    <label class="block font-semibold mb-2 text-gray-700">
                        Experience
                    </label>

                    <input
                            type="text"
                            name="experience"
                            placeholder="e.g. 3-5 Years"
                            class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:ring-2 focus:ring-cyan-500 outline-none">
                </div>

                <!-- Required Skills -->
                <div>
                    <label class="block font-semibold mb-2 text-gray-700">
                        Required Skills
                    </label>

                    <textarea
                            rows="4"
                            name="requiredSkills"
                            required
                            placeholder="Java, Spring Boot, Hibernate, SQL, REST API..."
                            class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:ring-2 focus:ring-cyan-500 outline-none resize-none"></textarea>
                </div>

                <!-- Preferred Skills -->
                <div>
                    <label class="block font-semibold mb-2 text-gray-700">
                        Preferred Skills
                    </label>

                    <textarea
                            rows="3"
                            name="preferredSkills"
                            placeholder="AWS, Docker, Kubernetes..."
                            class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:ring-2 focus:ring-cyan-500 outline-none resize-none"></textarea>
                </div>

                <!-- Education -->
                <div>
                    <label class="block font-semibold mb-2 text-gray-700">
                        Education
                    </label>

                    <input
                            type="text"
                            name="education"
                            placeholder="B.Tech Computer Science"
                            class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:ring-2 focus:ring-cyan-500 outline-none">
                </div>

                <!-- Qualifications -->
                <div>
                    <label class="block font-semibold mb-2 text-gray-700">
                        Qualifications
                    </label>

                    <textarea
                            rows="4"
                            name="qualifications"
                            placeholder="Strong problem solving, communication..."
                            class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:ring-2 focus:ring-cyan-500 outline-none resize-none"></textarea>
                </div>

                <!-- Submit -->
                <div class="text-center pt-4">

                    <button
                            type="submit"
                            class="bg-cyan-600 hover:bg-cyan-700 text-white font-semibold px-10 py-4 rounded-xl transition shadow-lg">

                        🔍 Find Best Resume

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
