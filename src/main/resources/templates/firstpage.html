<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen select-none bg-white">

<!-- Main Seperation Container -->
<div class="flex min-h-screen">

    <div class="w-3/5 flex item-center justify-center">
        <img src="/images/1pgai.jpg"
            alt="aiimage"
             class=" w-full h-full object-cover">
    </div>

    <div class="w-2/5 flex items-center justify-center bg-gray-50">

        <!-- Welcome Section -->
        <div id="welcomeSection" class="w-full max-w-md text-center px-8">

            <h1 class="text-5xl font-bold text-violet-800 mb-2">
                AIRes Pro
            </h1>

            <h1 class="text-4xl font-bold text-gray-800 mb-4">
                AI Resume Analyzer
            </h1>

            <p class="text-gray-500 text-lg mb-10">
                Welcome! Please sign in or create a new account.
            </p>

            <button onclick="showSignup()"
                    class="block w-full bg-cyan-600 hover:bg-cyan-700
                       text-white font-semibold py-4 mb-5 rounded-xl shadow-lg">
                Create Account
            </button>

            <button onclick="showSignin()"
                    class="block w-full bg-violet-600 hover:bg-violet-700
                       text-white font-semibold py-4 rounded-xl shadow-lg">
                Sign In
            </button>

            <p class="mt-10 text-sm text-gray-400">
                &copy; 2026 AIResProCmp, Inc. All rights reserved.
            </p>

        </div>

        <!-- Create Account Section -->
        <div id="signupSection"
             class="hidden w-full max-w-md px-8">

            <h1 class="text-3xl font-bold text-center mb-2">
                Welcome to AIRes Pro
            </h1>

            <p class="text-center text-gray-500 mb-8">
                Create your new account
            </p>

            <form th:action="@{/airesumeanalyzer/signup}" method="post"
                  class="space-y-5">

                <input type="text"
                       name="username"
                       placeholder="Username"
                       required
                       class="w-full px-4 py-3 border rounded-xl">

                <input type="text"
                       name="fullname"
                       placeholder="Full Name"
                       required
                       class="w-full px-4 py-3 border rounded-xl">

                <input type="password"
                       name="password"
                       placeholder="Password"
                       required
                       class="w-full px-4 py-3 border rounded-xl">

                <input type="number"
                       name="contact"
                       placeholder="Contact No."
                       required
                       class="w-full px-4 py-3 border rounded-xl">

                <input type="email"
                       name="email"
                       placeholder="Email"
                       required
                       class="w-full px-4 py-3 border rounded-xl">

                <button type="submit"
                        class="w-full bg-violet-600 hover:bg-violet-700
                           text-white py-3 rounded-xl">
                    Create
                </button>

            </form>

            <p th:if="${error}"
               th:text="${error}"
               class="text-red-600 text-center mt-3 mb-2">
            </p>

            <button onclick="showWelcome()"
                    class="mt-4 text-violet-600">
                ← Back
            </button>

        </div>

        <!-- Sign In Section -->
        <div id="signinSection"
             class="hidden w-full max-w-md px-8">

            <h1 class="text-3xl font-bold text-center mb-2">
                Welcome Back
            </h1>

            <p class="text-center text-gray-500 mb-8">
                Sign in to your account
            </p>

            <form th:action="@{/airesumeanalyzer/signin}" method="post"
                  class="space-y-5">

                <input type="text"
                       name="username"
                       placeholder="Username"
                       required
                       class="w-full px-4 py-3 border rounded-xl">

                <input type="password"
                       name="password"
                       placeholder="Password"
                       required
                       class="w-full px-4 py-3 border rounded-xl">

                <button type="submit"
                        class="w-full bg-violet-600 hover:bg-violet-700
                           text-white py-3 rounded-xl">
                    Sign In
                </button>

            </form>

            <p th:if="${invalid}"
               th:text="${invalid}"
               class="text-red-600 text-center mt-3 mb-2">
            </p>

            <button onclick="showWelcome()"
                    class="mt-4 text-violet-600">
                ← Back
            </button>

        </div>

    </div>


</div>

<script>
    function showSignin() {
        document.getElementById("welcomeSection").classList.add("hidden");
        document.getElementById("signinSection").classList.remove("hidden");
    }

    function showWelcome() {
        document.getElementById("signinSection").classList.add("hidden");
        document.getElementById("signupSection").classList.add("hidden");
        document.getElementById("welcomeSection").classList.remove("hidden");
    }

    function showSignup() {
        document.getElementById("welcomeSection").classList.add("hidden");
        document.getElementById("signupSection").classList.remove("hidden");
    }
</script>

</body>
</html>
