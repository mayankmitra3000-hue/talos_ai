<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-blue-500 to-indigo-600 min-h-screen flex items-center justify-center">

<div class="bg-white rounded-3xl shadow-2xl p-10 w-full max-w-md text-center">

    <!-- Logo / Title -->
    <h1 class="text-4xl font-bold text-gray-800 mb-3">
        AI Resume Analyzer
    </h1>

    <p class="text-gray-500 mb-8">
        Welcome! Please sign in or create a new account.
    </p>

    <!-- Buttons -->
    <div class="space-y-4">

        <!-- Sign In Button -->
        <a th:href="@{/airesumeanalyzer/signin}"
           class="block w-full bg-blue-600 hover:bg-blue-700
                  text-white font-semibold py-3 rounded-xl
                  transition duration-300">

            Sign In
        </a>

        <!-- Sign Up Button -->
        <a th:href="@{/signup}"
           class="block w-full bg-green-600 hover:bg-green-700
                  text-white font-semibold py-3 rounded-xl
                  transition duration-300">

            Create Account
        </a>

    </div>

    <!-- Footer -->
    <div class="mt-8 text-sm text-gray-400">
        Powered by Spring Boot + Thymeleaf
    </div>

</div>

</body>
</html>
