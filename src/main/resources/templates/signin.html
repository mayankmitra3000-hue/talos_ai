<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen select-none bg-white">

<!-- Main Seperation Container -->
<div class="flex min-h-screen">

    <div class="w-3/5 flex item-center justify-center">
        <img src="/images/signinbgt.jpg"
             alt="signinimage"
             class=" w-full h-full object-cover">
    </div>

    <div class="w-2/5 items-center justify-center bg-gray-50">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">
                Welcome Back
            </h1>
            <p class="text-gray-500 mt-2">
                Sign in to your account
            </p>
        </div>

        <!-- Success Message -->
        <div th:if="${valid}"
             class="bg-green-100 text-green-700 px-4 py-3 rounded-lg mb-4">
            <p th:text="${valid}"></p>
        </div>

        <!-- Error Message -->
        <div th:if="${invalid}"
             class="bg-red-100 text-red-700 px-4 py-3 rounded-lg mb-4">
            <p th:text="${invalid}"></p>
        </div>

        <!-- Signin Form -->
        <form th:action="@{/airesumeanalyzer/signin}" method="post" class="space-y-5">

            <!-- Username -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Username
                </label>

                <input type="text"
                       name="username"
                       placeholder="Enter username"
                       required
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl
                          focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Password
                </label>

                <input type="password"
                       name="password"
                       placeholder="Enter password"
                       required
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl
                          focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Remember Me + Forgot -->
            <div class="flex items-center justify-between text-sm">

                <label class="flex items-center gap-2 text-gray-600">
                    <input type="checkbox" class="rounded">
                    Remember me
                </label>

                <a href="#"
                   class="text-blue-600 hover:underline">
                    Forgot Password?
                </a>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700
                       text-white font-semibold py-3 rounded-xl
                       transition duration-300">

                Sign In
            </button>
        </form>

        <!-- Signup Link -->
        <div class="mt-6 text-center text-sm text-gray-600">

            Don't have an account?

            <a th:href="@{/signup}"
               class="text-blue-600 hover:underline font-medium">

                Create Account
            </a>
        </div>

    </div>
</div>

</body>
</html>
