<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head('Resume Analyzer')}"></div>

<body class="relative min-h-screen bg-cover bg-center bg-no-repeat animate-fadeIn select-none"
      style="background-image: url('/images/upperbgt.jpg');">

<!-- Dark Overlay -->
<div class="absolute inset-0 bg-black/50"></div>

<!-- Main Content -->
<div class="relative z-10">

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Spacer -->
    <div class="h-24"></div>

    <div class="max-w-4xl mx-auto px-6 pb-16">

        <!-- Heading -->
        <div class="text-center mb-10">

            <h1 class="text-5xl font-extrabold text-white">
                AI Resume Analyzer
            </h1>

            <p class="text-gray-200 text-lg mt-4 max-w-2xl mx-auto leading-8">
                Upload your resume and receive AI-powered feedback on
                formatting, grammar, strengths, weaknesses, ATS compatibility,
                and personalized improvement suggestions.
            </p>

        </div>

        <!-- Upload Card -->
        <div class="bg-white/90 backdrop-blur-lg rounded-3xl shadow-2xl
                    border-t-4 border-blue-500 p-10">

            <form th:action="@{/airesumeanalyzer/analyzeresume}"
                  method="post"
                  enctype="multipart/form-data">

                <!-- Upload Area -->
                <label for="resume"
                       class="flex flex-col items-center justify-center
                              border-2 border-dashed border-blue-400
                              rounded-3xl h-72 cursor-pointer
                              hover:border-blue-600
                              hover:bg-blue-50
                              transition">

                    <div class="text-6xl mb-4">
                        ☁️
                    </div>

                    <h2 class="text-2xl font-bold text-gray-800">
                        Upload Resume
                    </h2>

                    <p class="text-gray-600 mt-2 text-center">
                        Drag & Drop your resume here
                        <br>
                        or click to browse
                    </p>

                    <p class="text-sm text-gray-500 mt-4">
                        Supported format: Kindly Upload PDF Only
                    </p>

                    <input
                            id="resume"
                            name="resume"
                            type="file"
                            accept=".pdf"
                            required
                            class="hidden">

                </label>

                <!-- Selected File -->
                <div class="mt-6 text-center">

                    <p id="fileName"
                       class="text-blue-700 font-semibold">
                        No file selected
                    </p>

                </div>

                <!-- Analyze Button -->
                <div class="mt-10 text-center">

                    <button
                            type="submit"
                            class="px-10 py-4 rounded-xl
                                   bg-blue-600
                                   hover:bg-blue-700
                                   text-white
                                   text-lg
                                   font-bold
                                   shadow-lg
                                   transition
                                   hover:scale-105">

                        Analyse Resume →

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<!-- Show Selected File Name -->
<script>

    const fileInput = document.getElementById("resume");
    const fileName = document.getElementById("fileName");

    fileInput.addEventListener("change", function () {

        if (this.files.length > 0) {
            fileName.textContent = "Selected File: " + this.files[0].name;
        } else {
            fileName.textContent = "No file selected";
        }

    });

</script>

</body>
</html>
