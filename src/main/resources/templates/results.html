<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Resume Analysis Result</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center p-6">

<div class="bg-white shadow-2xl rounded-2xl p-10 w-full max-w-5xl">

    <!-- Heading -->
    <h1 class="text-4xl font-bold text-center text-blue-600 mb-6">
        Resume Analysis Result
    </h1>

    <!-- Error Message -->
    <div
            th:if="${error}"
            class="bg-red-100 text-red-700 p-4 rounded-lg mb-6"
            th:text="${error}">
    </div>

    <!-- Resume Text -->
    <div th:if="${analysis}">

        <h2 class="text-2xl font-semibold text-gray-700 mb-4">
            Your Resume Analysis
        </h2>

        <div class="bg-gray-50 border border-gray-300 rounded-xl p-6 max-h-[600px] overflow-y-auto">

            <pre
                    class="whitespace-pre-wrap text-gray-800 text-sm leading-7"
                    th:text="${analysis}">
            </pre>

        </div>

    </div>

    <!-- Back Button -->
    <div class="mt-8 text-center">

        <a
                href="/airesumeanalyzer"
                class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold transition duration-300">
            Upload Another Resume
        </a>

    </div>

</div>

</body>
</html>
