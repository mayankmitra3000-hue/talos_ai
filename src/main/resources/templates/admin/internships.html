<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head('Manage Internships')}"></div>
<body class="min-h-screen bg-cover bg-center bg-fixed bg-no-repeat" style="background-image:url('/images/upperbgt.jpg');">
<div class="fixed inset-0 bg-black/60"></div>
<div class="relative z-10">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="h-24"></div>
    <main class="max-w-7xl mx-auto px-6 pb-14">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-white">Manage Internships</h1>
            <p class="mt-3 text-gray-200">Upload internship opportunities with job descriptions and seat limits</p>
        </div>

        <div class="mb-8 rounded-3xl bg-white/95 border-t-4 border-cyan-500 p-8 shadow-2xl">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Post New Internship</h2>
            <div th:if="${success}" class="mb-4 rounded-xl border border-green-300 bg-green-100 text-green-700 px-5 py-4">
                <p th:text="${success}"></p>
            </div>
            <form th:action="@{/airesumeanalyzer/admin/internships}" method="post" class="space-y-6">
                <div>
                    <label class="block font-semibold mb-2 text-gray-700">Internship Title</label>
                    <input type="text" name="title" required class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:ring-2 focus:ring-cyan-500 outline-none" placeholder="e.g. Software Engineering Intern">
                </div>
                <div>
                    <label class="block font-semibold mb-2 text-gray-700">Description</label>
                    <textarea name="description" required rows="5" class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:ring-2 focus:ring-cyan-500 outline-none resize-none" placeholder="Enter internship description..."></textarea>
                </div>
                <div>
                    <label class="block font-semibold mb-2 text-gray-700">Required Skills</label>
                    <textarea name="requiredSkills" rows="3" class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:ring-2 focus:ring-cyan-500 outline-none resize-none" placeholder="Java, Spring Boot, SQL..."></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block font-semibold mb-2 text-gray-700">Experience</label>
                        <input type="text" name="experience" class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:ring-2 focus:ring-cyan-500 outline-none" placeholder="e.g. 0-1 Years">
                    </div>
                    <div>
                        <label class="block font-semibold mb-2 text-gray-700">Location</label>
                        <input type="text" name="location" class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:ring-2 focus:ring-cyan-500 outline-none" placeholder="e.g. Remote/Onsite">
                    </div>
                    <div>
                        <label class="block font-semibold mb-2 text-gray-700">Number of Seats</label>
                        <input type="number" name="seats" required min="1" class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:ring-2 focus:ring-cyan-500 outline-none" placeholder="e.g. 5">
                    </div>
                </div>
                <button type="submit" class="px-8 py-3 rounded-xl bg-cyan-600 text-white font-semibold hover:bg-cyan-700 transition">Post Internship</button>
            </form>
        </div>

        <div class="rounded-3xl bg-white/95 border-t-4 border-violet-500 p-8 shadow-2xl">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Posted Internships</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div th:each="internship : ${internships}" class="rounded-2xl border border-gray-200 p-6">
                    <h3 class="text-xl font-bold text-gray-800" th:text="${internship.title}"></h3>
                    <p class="mt-2 text-gray-600 whitespace-pre-wrap" th:text="${internship.description}"></p>
                    <div class="mt-4 space-y-2 text-sm text-gray-700">
                        <p><strong>Required Skills:</strong> <span th:text="${internship.requiredSkills}"></span></p>
                        <p><strong>Experience:</strong> <span th:text="${internship.experience}"></span></p>
                        <p><strong>Location:</strong> <span th:text="${internship.location}"></span></p>
                        <p><strong>Seats:</strong> <span th:text="${internship.seats}"></span> | <strong>Allocated:</strong> <span th:text="${internship.allocatedCount}"></span></p>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(internships)}" class="text-center text-gray-500 py-8">
                No internships posted yet.
            </div>
        </div>
    </main>
</div>
</body>
</html>
