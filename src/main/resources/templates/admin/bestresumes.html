<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head('Best Ranked Resumes')}"></div>
<body class="min-h-screen bg-cover bg-center bg-fixed bg-no-repeat" style="background-image:url('/images/upperbgt.jpg');">
<div class="fixed inset-0 bg-black/60"></div>
<div class="relative z-10">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="h-24"></div>
    <main class="max-w-7xl mx-auto px-6 pb-14">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-white">Best Ranked Resumes</h1>
            <p class="mt-3 text-gray-200">View best ranked resumes as per internships using RAG</p>
        </div>

        <div class="mb-8 rounded-3xl bg-white/95 border-t-4 border-violet-500 p-8 shadow-2xl">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Select Internship</h2>
            <form th:action="@{/airesumeanalyzer/admin/bestresumes}" method="post" class="flex gap-4">
                <select name="internshipId" required class="flex-1 rounded-xl border border-gray-300 px-4 py-3 focus:ring-2 focus:ring-violet-500 outline-none">
                    <option value="">-- Select Internship --</option>
                    <option th:each="internship : ${internships}" th:value="${internship.id}" th:text="${internship.title}"></option>
                </select>
                <button type="submit" class="px-8 py-3 rounded-xl bg-violet-600 text-white font-semibold hover:bg-violet-700 transition">Find Best Resumes</button>
            </form>
            <div th:if="${error}" class="mt-4 rounded-xl border border-red-300 bg-red-100 text-red-700 px-5 py-4">
                <p th:text="${error}"></p>
            </div>
        </div>

        <div th:if="${selectedInternship}" class="mb-8 rounded-3xl bg-white/95 border-t-4 border-cyan-500 p-8 shadow-2xl">
            <h2 class="text-2xl font-bold text-gray-800 mb-2" th:text="${selectedInternship.title}"></h2>
            <p class="text-gray-600 whitespace-pre-wrap" th:text="${selectedInternship.description}"></p>
        </div>

        <div th:if="${aiComparison}" class="mb-8 rounded-3xl bg-white/95 border-t-4 border-green-500 p-8 shadow-2xl">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">AI Comparison & Ranking</h2>
            <div class="prose max-w-none text-gray-700 whitespace-pre-wrap" th:text="${aiComparison}"></div>
        </div>

        <div th:if="${matches}" class="rounded-3xl bg-white/95 border-t-4 border-orange-500 p-8 shadow-2xl">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Ranked Candidates</h2>
            <div class="space-y-4">
                <div th:each="match, iterStat : ${matches}" class="rounded-2xl border border-gray-200 p-6">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="text-lg font-bold text-gray-800">Rank <span th:text="${iterStat.count}"></span></h3>
                            <p class="text-gray-700"><strong>Student:</strong> <span th:text="${match.studentName}"></span> (<span th:text="${match.studentUsername}"></span>)</p>
                            <p class="text-gray-700"><strong>Default Resume:</strong> <span th:text="${match.resume.fileName}"></span></p>
                        </div>
                        <div class="text-right">
                            <p class="text-2xl font-bold text-violet-600"><span th:text="${match.percentage}"></span>%</p>
                            <p class="text-sm text-gray-500">Match Score</p>
                        </div>
                    </div>
                    <div class="mt-4">
                        <p class="font-semibold text-gray-700 mb-2">Matched Content:</p>
                        <p class="text-sm text-gray-600 whitespace-pre-wrap bg-gray-50 p-4 rounded-xl" th:text="${match.matchedContent}"></p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
