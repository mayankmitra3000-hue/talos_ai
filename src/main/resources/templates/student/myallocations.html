<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head('My Allocations')}"></div>
<body class="min-h-screen bg-cover bg-center bg-fixed bg-no-repeat" style="background-image:url('/images/upperbgt.jpg');">
<div class="fixed inset-0 bg-black/60"></div>
<div class="relative z-10">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="h-24"></div>
    <main class="max-w-6xl mx-auto px-6 pb-14">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-white">My Allocations</h1>
            <p class="mt-3 text-gray-200">Internships allocated to you</p>
        </div>

        <div class="rounded-3xl bg-white/95 border-t-4 border-green-500 p-8 shadow-2xl">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div th:each="allocation : ${allocations}" class="rounded-2xl border border-gray-200 p-6">
                    <h3 class="text-xl font-bold text-gray-800" th:text="${allocation.internship.title}"></h3>
                    <p class="mt-2 text-gray-600 whitespace-pre-wrap" th:text="${allocation.internship.description}"></p>
                    <div class="mt-4 space-y-2 text-sm text-gray-700">
                        <p><strong>Required Skills:</strong> <span th:text="${allocation.internship.requiredSkills}"></span></p>
                        <p><strong>Experience:</strong> <span th:text="${allocation.internship.experience}"></span></p>
                        <p><strong>Location:</strong> <span th:text="${allocation.internship.location}"></span></p>
                        <p><strong>Match Score:</strong> <span class="text-violet-600 font-semibold" th:text="${#numbers.formatDecimal(allocation.matchScore * 100, 1, 2)} + '%'"></span></p>
                    </div>
                    <div class="mt-4 px-4 py-2 bg-green-100 text-green-700 rounded-xl text-center font-semibold">
                        Allocated
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(allocations)}" class="text-center text-gray-500 py-12">
                <p class="text-lg">No internships allocated yet.</p>
                <p class="mt-2">Keep checking as allocations are made by the admin.</p>
            </div>
        </div>
    </main>
</div>
</body>
</html>
