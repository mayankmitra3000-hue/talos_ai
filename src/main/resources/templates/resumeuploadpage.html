<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head('ResumeUploadPage')}"></div>

<body class="min-h-screen bg-cover bg-center bg-no-repeat animate-fadeIn"
      style="background-image:url('/images/upperbgt.jpg');">

<!-- Nav Bar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Upload Card -->
<div class="flex justify-center items-center min-h-screen pt-24">

    <div class="bg-white/90 backdrop-blur-lg shadow-2xl rounded-3xl p-10 w-full max-w-xl">

        <h2 class="text-3xl font-bold text-center text-violet-700">
            Upload Your Resume
        </h2>

        <p class="text-center text-gray-600 mt-2 mb-8">
            Upload your resume in PDF format securely.
        </p>

        <!-- Success Message -->
        <div th:if="${uploaded}"
             class="mb-4 p-3 rounded-lg bg-green-100 text-green-700 text-center font-medium">

            <span th:text="${uploaded}"></span>

        </div>

        <!-- Error Message -->
        <div th:if="${error}"
             class="mb-4 p-3 rounded-lg bg-red-100 text-red-700 text-center font-medium">

            <span th:text="${error}"></span>

        </div>

        <form th:action="@{/airesumeanalyzer/uploadresume}"
              method="post"
              enctype="multipart/form-data">

            <div class="mb-6">

                <label class="block text-gray-700 font-semibold mb-2">
                    Select Resume (PDF)
                </label>

                <input type="file"
                       name="resume"
                       accept=".pdf"
                       required
                       class="w-full border rounded-lg p-3
                              file:bg-violet-600
                              file:text-white
                              file:border-0
                              file:px-4
                              file:py-2
                              file:rounded-lg
                              file:cursor-pointer
                              hover:file:bg-violet-700">

            </div>

            <button type="submit"
                    class="w-full bg-violet-600 hover:bg-violet-700 text-white py-3 rounded-xl text-lg font-semibold transition">

                Upload Resume

            </button>

        </form>

    </div>

</div>

</body>
</html>
